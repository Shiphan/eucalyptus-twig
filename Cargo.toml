[package]
name = "eucalyptus-twig"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.31"
heapless = "0.9.2"
iced_core = "0.14.0"
iced_futures = { version = "0.14.0", features = ["tokio"] }
iced_graphics = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["wgpu-bare"] }
iced_runtime = { version = "0.14.0", features = ["sipper"] }
iced_wgpu = "0.14.0"
iced_widget = { version = "0.14.2", features = ["canvas"] }
pipewire = "0.9.2"
raw-window-handle = "0.6.2"
serde = "1.0.228"
serde_json = "1.0.147"
serde_repr = "0.1.20"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
time = { version = "0.3.44", default-features = false, features = ["formatting", "local-offset"] }
tokio = { version = "1.53.1", features = ["process", "rt", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wayland-client = "0.31.12"
wayland-protocols = { version = "0.32.10", features = ["client", "staging"] }
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }

[lints.clippy]
semicolon_if_nothing_returned = "warn"
