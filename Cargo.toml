[package]
name = "eucalyptus-twig"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compat = "0.2.5"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.31"
gpui = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["wayland"] }
heapless = "0.9.2"
lyon = "1.0.16"
pipewire = "0.9.2"
serde = "1.0.228"
serde_json = "1.0.147"
serde_repr = "0.1.20"
smol = "2.0.2"
time = { version = "0.3.44", default-features = false, features = ["formatting", "local-offset"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.22"
wayland-client = "0.31.12"
wayland-protocols = { version = "0.32.10", features = ["client", "staging"] }
zbus = { version = "5.12.0", default-features = false, features = ["async-io"] }

[features]
default = []
tracing-info = []
tracing-trace = []

[lints.clippy]
semicolon_if_nothing_returned = "warn"
